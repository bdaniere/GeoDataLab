[tool.poetry]
name = "GeoDataLab_ingestion"
version = "0.1.0"
description = ""
authors = ["bdaniere <benjamin.daniere@gmail.com>"]
package-mode = false 

[tool.poetry.dependencies]
python = "~3.13.0"
geopandas = "^1.1.4"
sqlalchemy = "^2.1.6"
psycopg2-binary = "^2.9.13"
geoalchemy2 = "^0.20.0"
requests = "^2.34.2"
python-dotenv = "^1.2.4"
py7zr = "^1.0.0"
pandas = "^3.1.0"
pyyaml = "^6.0.3"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["extraction"]
python_files = ["test_*.py"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 95
[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)"
]
