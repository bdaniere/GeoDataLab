[project]
name = "geodatalab"
version = "0.1.0"
description = ""
authors = [{ name = "bdaniere", email = "benjamin.daniere@gmail.com" }]
requires-python = "~=3.13.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "geopandas>=1.1.4,<2",
    "sqlalchemy>=2.1.6,<3",
    "psycopg2-binary>=2.9.13,<3",
    "geoalchemy2>=0.20.0,<0.21",
    "requests>=2.34.2,<3",
    "python-dotenv>=1.2.4,<2",
    "py7zr>=1.0.0,<2",
    "pandas>=3.1.0,<4",
    "pyyaml>=6.0.3,<7",
    "geodatalab-ingestion",
]

[tool.uv]
package = false

[tool.uv.sources]
geodatalab-ingestion = { git = "https://github.com/bdaniere/GeoDataLab-Ingestion.git", tag = "v0.3.0" }

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "extraction"]
python_files = ["test_*.py"]

[tool.black]
line-length = 95
[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)"
]
