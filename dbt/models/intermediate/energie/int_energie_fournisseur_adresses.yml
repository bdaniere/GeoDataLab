models:
  - name: int_energie_fournisseur_adresses
    description: >-
      Association entre chaque enregistrement fournisseur et tous les points
      intermédiaires issus de son adresse source. Une adresse source peut
      produire plusieurs points ; les enregistrements sans correspondance
      restent présents dans int_energie_fournisseur mais pas dans cette table.
      Reconstruire cette association après ses modèles parents pour actualiser
      les liens et les clés étrangères.
    config:
      alias: energie_fournisseur_adresses
      contract:
        enforced: true

    constraints:
      - type: primary_key
        columns: [energie_fournisseur_id, adresse_id]
      - type: foreign_key
        columns: [energie_fournisseur_id]
        to: ref('int_energie_fournisseur')
        to_columns: [id]
      - type: foreign_key
        columns: [adresse_id]
        to: ref('int_adresses')
        to_columns: [id]

    columns:
      - name: energie_fournisseur_id
        description: Identifiant de l'enregistrement fournisseur.
        data_type: text
        constraints:
          - type: not_null
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_energie_fournisseur')
                field: id
      - name: adresse_id
        description: Identifiant UUID du point dans intermediate.adresses.
        data_type: uuid
        constraints:
          - type: not_null
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_adresses')
                field: id

unit_tests:
  - name: int_energie_fournisseur_adresses_multiples_et_absentes
    description: Associe tous les points correspondants et ignore les adresses absentes.
    model: int_energie_fournisseur_adresses
    given:
      - input: ref('int_energie_fournisseur')
        format: sql
        rows: |
          SELECT 'f1'::text AS id, 'source-1'::varchar(26) AS adresse_id
          UNION ALL SELECT 'f2', 'source-1'
          UNION ALL SELECT 'f3', 'absente'
          UNION ALL SELECT 'f4', NULL
      - input: ref('int_adresses')
        format: sql
        rows: |
          SELECT '00000000-0000-0000-0000-000000000001'::uuid AS id, 'source-1'::text AS source_id
          UNION ALL SELECT '00000000-0000-0000-0000-000000000002'::uuid, 'source-1'
          UNION ALL SELECT '00000000-0000-0000-0000-000000000003'::uuid, 'source-2'
    expect:
      rows:
        - {energie_fournisseur_id: 'f1', adresse_id: '00000000-0000-0000-0000-000000000001'}
        - {energie_fournisseur_id: 'f1', adresse_id: '00000000-0000-0000-0000-000000000002'}
        - {energie_fournisseur_id: 'f2', adresse_id: '00000000-0000-0000-0000-000000000001'}
        - {energie_fournisseur_id: 'f2', adresse_id: '00000000-0000-0000-0000-000000000002'}
