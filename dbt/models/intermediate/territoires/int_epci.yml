models:
  - name: int_epci
    description: Copie des EPCI du staging, sans transformation supplémentaire.
    config:
      alias: epci
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns: [id]
    columns:
      - name: id
        data_type: varchar(9)
        constraints:
          - type: not_null
        data_tests:
          - not_null
          - unique
      - name: nom
        data_type: text
      - name: type
        data_type: varchar(26)
      - name: created_at
        data_type: timestamp
      - name: updated_at
        data_type: timestamp
      - name: updated_by
        data_type: text
      - name: geom
        data_type: geometry(MultiPolygon,2154)
        data_tests:
          - spatial_index
