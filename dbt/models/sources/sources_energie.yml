              - unique

          - name: fournisseur
            description: Electricity supplier
            data_tests:
              - not_null

          - name: annee
            description: Year of the data
            data_tests:
              - not_null 

          - name: filiere
            description: Energy sector
            data_tests:
              - not_null

          - name: iris
            description: IRIS name
            data_tests:
              - not_null

          - name: adresse
            description: Full address as a single string
            data_tests:
              - not_null
          
          - name : commune
            description: Commune name
            data_tests:
              - not_null

          - name: conso
            description: Electricity consumption (in MWh)
            data_tests:
              - not_null

          - name: pdl
            description: Number of delivery points (PDL)
            data_tests:
              - not_null
  
          - name: commune_id
