version: 2

sources:
  - name: raw_data
    schema: raw_data
    tables:
      - name: consommation_electricite_iris_2025
        description: lists annual electricity consumption (in MWh) and the number of delivery points for the year 2025 at the statistical neighborhood level (IRIS zone), broken down by economic sector (residential, service, industrial, agricultural)
        columns:
          - name: operateur
            description: Electricity operator
            data_tests:
              - not_null

          - name: nom_commune
            description: Name of the commune
            data_tests:
              - not_null

          - name: annee
            description: Year of the data
            data_tests:
              - not_null

          - name: filiere
            description: Energy sector
            data_tests:
              - not_null

          - name: code_iris
            description : IRIS code (statistical neighborhood identifier)
            data_tests:
              - not_null

          - name: conso
            description: Electricity consumption (in MWh)
            data_tests:
              - not_null
          
      - name: consommation_froid_chaud_iris_2025
        description: records annual thermal energy consumption (deliveries from heating and cooling networks, in MWh) and the number of delivery points for the year 2025 at the statistical neighborhood level (IRIS zone), broken down by sector of activity (residential, commercial/tertiary, industrial), while ensuring compliance with statistical confidentiality requirements.
        columns:
          - name: operateur
            description: Thermal energy operator
            data_tests:
              - not_null

          - name: annee
            description: Year of the data
            data_tests:
              - not_null

          - name: filiere
            description: Energy sector
            data_tests:
              - not_null

          - name: iris
            description: IRIS code (statistical neighborhood identifier)
            data_tests:
              - not_null

          - name: conso
            description: Thermal energy consumption (in MWh)
            data_tests:
              - not_null
      
      - name : imope_chaleur_urbaine
        description: records annual thermal energy consumption (deliveries from heating and cooling networks, in MWh) and the number of delivery points for the year 2025 at the statistical neighborhood level (IRIS zone), broken down by sector of activity (residential, commercial/tertiary, industrial), while ensuring compliance with statistical confidentiality requirements.
        columns:
          - name: id
            description: Unique identifier for each record
            data_tests:
              - not_null
              - unique
  
          - name: fournisseur
            description: Thermal energy supplier
            data_tests:
              - not_null

          - name: annee
            description: Year of the data
            data_tests:
              - not_null 

          - name: filiere
            description: Energy sector
            data_tests:
              - not_null

          - name: iris
            description: IRIS name
            data_tests:
              - not_null

          - name : iris_id
            description: Source IRIS identifier.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw_data', 'imope_iris')
                    field: id

