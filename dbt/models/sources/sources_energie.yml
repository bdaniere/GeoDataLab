      - name: imope_energie_fournisseur
        description : collects and geolocates actual energy consumption and connection data (electricity, natural gas, and heating networks) sourced from grid operators and energy suppliers, in order to link this data directly to specific addresses and buildings, provided that the legal thresholds for anonymization are met
        columns:
          - name: id
            description: Unique identifier for each record
            data_tests:
              - not_null
              - unique

          - name: adresse
            description: Full address as a single string
            data_tests:
              - not_null

          - name: annee
            description: Year of the data
            data_tests:
              - not_null 

          - name : commune_id
            description: Source commune identifier.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw_data', 'imope_commune')
                    field: id
              

