version: 2

sources:
  - name: raw_data
    schema: raw_data
    tables:
      - name : imope_commune
        description: administrative and statistical reference framework at the municipal level
        columns:
          - name: id
            description: Unique identifier for each commune
            data_tests:
              - not_null
              - unique

          - name: insee
            description: INSEE code for the commune
            data_tests:
              - not_null

          - name: nom
            description: Name of the commune
            data_tests:
              - not_null

          - name: nom_unaccent
            description: Unaccented name of the commune
            data_tests:
              - not_null

          - name: cp
            description: Postal code of the commune
            
          - name: superficie
            description: Surface area of the commune

          - name: population
            description: Population of the commune

          - name: epci
            description : EPCI (Public Establishment for Inter-municipal Cooperation) name
            data_tests:
              - not_null
              
          - name: epci_id
            description: Source EPCI identifier.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw_data', 'imope_epci')
                    field: id

          - name: geometry
            description: Geometry of the commune (MULTIPOLYGON)
            data_tests:
              - not_null
              - unique
              - geometry_valid:
                  config:
                    store_failures: true
                    severity: warn

      - name: imope_parcelle
        description: official cadastral footprint
        columns:
          - name: id
            description: Unique identifier for each parcel
            data_tests:
              - not_null
              - unique

          - name: prefixe
            description: Prefix of the parcel identifier
            data_tests:
              - not_null

          - name: section
            description: Section of the parcel identifier
            data_tests:
              - not_null

          - name: numero
            description: Number of the parcel identifier
            data_tests:
              - not_null

          - name: created
            description: Creation timestamp of the parcel record
            data_tests:
              - not_null

          - name: updated
            description: Update timestamp of the parcel record
            data_tests:
              - not_null

          - name: commune_id
            description: Source commune identifier.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw_data', 'imope_commune')
                    field: id

          - name: geometry
            description: Geometry of the parcel (MULTIPOLYGON)
            data_tests:
              - not_null
              - unique
              - geometry_valid:
                  config:
                    store_failures: true
                    severity: warn

      - name: imope_iris
        description: official sub-municipal geographical breakdown by INSEE
        columns:
          - name: id
            description: Unique identifier for each IRIS
            data_tests:
              - not_null
              - unique

          - name: nom
            description: Name of the IRIS
            data_tests:
              - not_null

          - name: type
            description: Type of the IRIS
            data_tests:
              - not_null
  

          - name: commune
            description: Name of the commune
            data_tests:
              - not_null

          - name: commune_id
            description: Source commune identifier.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw_data', 'imope_commune')
                    field: id

          - name: geometry
            description: Geometry of the IRIS (MULTIPOLYGON)
            data_tests:
              - not_null
              - unique
              - geometry_valid:
                  config:
                    store_failures: true
                    severity: warn

      - name: imope_epci
        description : administrative and geographical reference framework for Public Establishments for Intercommunal Cooperation with their own tax-raising powers
        columns:
          - name: id
            description: Unique identifier for each EPCI
            data_tests:
              - not_null
              - unique

          - name: nom
            description: Name of the EPCI
            data_tests:
              - not_null

          - name: type
            description: Type of the EPCI
            data_tests:
              - not_null 
          
          - name: geometry
            description: Geometry of the EPCI (MULTIPOLYGON)
            data_tests:
              - not_null
              - unique
              - geometry_valid:
                  config:
                    store_failures: true
                    severity: warn