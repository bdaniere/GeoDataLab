models:
  - name: batiments
    data_tests:
      - staging_audit
    config:
      contract:
        enforced: true

    constraints:
      - type: primary_key
        # name: pk_batiments
        columns: [id]

    columns:
      - name: id
        data_type: uuid
        constraints:
          - type: not_null

        data_tests:
          - not_null
          - unique

      - name: type
        data_type: varchar(2)

      - name: nom
        data_type: text

      - name: created_at
        data_type: TIMESTAMP

      - name: updated_at
        data_type: TIMESTAMP

      - name: updated_by
        data_type: text

      - name: geom
        data_type: geometry(MultiPolygon,2154)
        data_tests:
              - not_null
              - unique
              - geometry_valid:
                  config:
                    store_failures: true