models:
  - name: rpls
    description: Staging transformation of Social Housing Directory (RPLS) data, integrating and geolocating rental housing owned by social landlords. Identifies, counts, and characterizes social housing units including their typology, floor area, energy performance rating (DPE), financing method, year of commissioning, and social landlord at each IMOPE address level. Derived from raw_data.imope_rpls.
    data_tests:
      - staging_audit
    config:
      contract:
        enforced: true

    constraints:
      - type: primary_key
        columns: [id]

      - type: foreign_key
        columns: [commune_id]
        to: ref('communes')
        to_columns: [id]


    columns:
      - name: id
        description: Identifiant unique de l'enregistrement RPLS.
        data_type: varchar(36)
        constraints:
          - type: not_null
        data_tests:
          - not_null
          - unique
      - name: adresse
        description: Adresse complète du logement sous forme de texte unique.
        data_type: text
        data_tests:
          - not_null
      - name: code_postal
        description: Code postal du logement.
        data_type: text
        data_tests:
          - not_null
      - name: commune
        description: Nom de la commune.
        data_type: text
        data_tests:
          - not_null
      - name: etage
        description: Étage du logement.
        data_type: text
      - name: npiece
        description: Nombre de pièces du logement.
        data_type: integer
      - name: surfhab
        description: Surface habitable du logement (m²).
        data_type: integer
      - name: annee_construction
        description: Année de construction de l'immeuble.
        data_type: integer
      - name: dpe
        description: Classe du diagnostic de performance énergétique (A à G).
        data_type: varchar(1)
      - name: date_dpe
        description: Date source conservée en texte, avec une précision au mois.
        data_type: date
      - name: commune_id
        description: Identifiant de la commune (référence vers communes.id).
        data_type: varchar(5)
      - name: ban_id
        description: Identifiant BAN source, éventuellement absent ou sans correspondance.
        data_type: varchar(22)
      - name: created_at
        description: Date de création de la ligne (colonne d'audit).
        data_type: timestamp
      - name: updated_at
        description: Date de dernière modification de la ligne (colonne d'audit).
        data_type: timestamp
      - name: updated_by
        description: Utilisateur de la dernière modification de la ligne (colonne d'audit).
        data_type: text
