models:
  - name: communes
    description: Staging transformation of administrative and statistical reference framework at the municipal level. Includes commune identifiers, INSEE codes, geography, demographics, and regional groupings (EPCI). Provides essential geographic and administrative hierarchy data. Derived from raw_data.imope_commune.
    data_tests:
      - staging_audit
    config:
      contract:
        enforced: true

    constraints:
      - type: primary_key
        # name: pk_communes_france
        columns: [id]

      - type: foreign_key
        columns: [epci_id]
        to: ref('epci')
        to_columns: [id]

    columns:

      - name: id
        data_type: varchar(9)
        constraints:
          - type: not_null
        data_tests:
          - not_null
          - unique

      - name: code_insee
        data_type: varchar(5)
        constraints:
          - type: not_null
        data_tests:
          - not_null

      - name: nom
        data_type: text

      - name: nom_unaccent
        data_type: text

      - name: code_postal
        data_type: varchar(5)

      - name: superficie
        data_type: float

      - name: population
        data_type: integer

      - name: epci
        data_type: text

      - name: epci_id
        data_type: varchar(9)

      - name: type_commune
        data_type: varchar(14)

      - name: created_at
        data_type: timestamp

      - name: updated_at
        data_type: timestamp

      - name: updated_by
        data_type: text

      - name: geom
        data_type: geometry(MultiPolygon,2154)
        data_tests:
              - not_null
              - unique
              - geometry_valid:
                  config:
                    store_failures: true