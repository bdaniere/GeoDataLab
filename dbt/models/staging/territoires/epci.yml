models:
  - name: epci
    description: Staging transformation of administrative and geographical reference framework for Public Establishments for Intercommunal Cooperation (EPCI) with their own tax-raising powers. Provides consolidation of commune groupings and regional organization data at the intercommunal level. Derived from raw_data.imope_epci.
    data_tests:
      - staging_audit
    config:
      contract:
        enforced: true

    constraints:
      - type: primary_key
        columns: [id]

    columns:
      - name: id
        description: Identifiant unique de l'EPCI.
        data_type: varchar(9)
        constraints:
          - type: not_null
        data_tests:
          - not_null
          - unique
      - name: nom
        description: Nom de l'EPCI.
        data_type: text
        data_tests:
          - not_null
      - name: type
        description: Type d'EPCI (métropole, communauté d'agglomération, etc.).
        data_type: varchar(26)
        data_tests:
          - not_null
      - name: created_at
        description: Date de création de la ligne (colonne d'audit).
        data_type: timestamp
      - name: updated_at
        description: Date de dernière modification de la ligne (colonne d'audit).
        data_type: timestamp
      - name: updated_by
        description: Utilisateur de la dernière modification de la ligne (colonne d'audit).
        data_type: text
      - name: geom
        description: Contour de l'EPCI (MULTIPOLYGON, Lambert-93).
        data_type: geometry(MultiPolygon,2154)
        data_tests:
          - not_null
          - unique
          - geometry_valid:
              config:
                store_failures: true
                severity: warn
