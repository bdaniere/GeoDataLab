models:
  - name: epci
    description: Staging transformation of administrative and geographical reference framework for Public Establishments for Intercommunal Cooperation (EPCI) with their own tax-raising powers. Provides consolidation of commune groupings and regional organization data at the intercommunal level. Derived from raw_data.imope_epci.
    data_tests:
      - staging_audit
    config:
      contract:
        enforced: true

    constraints:
      - type: primary_key
        columns: [id]

    columns:
      - name: id
        data_type: varchar(9)
        constraints:
          - type: not_null
        data_tests:
          - not_null
          - unique
      - name: nom
        data_type: text
        data_tests:
          - not_null
      - name: type
        data_type: varchar(26)
        data_tests:
          - not_null
      - name: created_at
        data_type: timestamp
      - name: updated_at
        data_type: timestamp
      - name: updated_by
        data_type: text
      - name: geom
        data_type: geometry(MultiPolygon,2154)
        data_tests:
          - not_null
          - unique
          - geometry_valid:
              config:
                store_failures: true
                severity: warn
