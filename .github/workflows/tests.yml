name: Tests Python

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ingestion
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: poetry
          cache-dependency-path: ingestion/poetry.lock

      - name: Install Poetry
        run: python -m pip install poetry==2.5.1

      - name: Install project and test dependencies
        run: poetry install --no-interaction --with dev

      - name: Run unit tests
        run: poetry run pytest
