services: 
  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGIS_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - geodatalab_network

    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  geoserver:
    image: docker.osgeo.org/geoserver:2.28.2
    restart: unless-stopped

    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}

    ports:
      - "8080:8080"

    volumes:
      - geoserver_data:/opt/geoserver_data

    depends_on: 
      postgis:
        condition: service_healthy

    networks:
      - geodatalab_network

  dbt:
    build:
      context: ../dbt
    container_name: dbt
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DBT_PROFILES_DIR: /usr/config/dbt
    volumes:
      - ../dbt:/usr/app
      - ../config/dbt:/usr/config/dbt:ro
    working_dir: /usr/app
    depends_on:
      postgis:
        condition: service_healthy
    networks:
      - geodatalab_network
    profiles:
      - tools
    ports:
      - "8081:8080"

  ingestion:
    build:
      context: ../ingestion
      dockerfile: Dockerfile

    container_name: ingestion

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgis
      POSTGIS_PORT: "5432"

    depends_on:
      postgis:
        condition: service_healthy

    networks:
      - geodatalab_network

networks:
  geodatalab_network:
    driver: bridge

volumes:
  postgres_data:
  geoserver_data: