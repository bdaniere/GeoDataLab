models:
  - name: iris
    config:
      contract:
        enforced: true

    constraints:
      - type: primary_key
        # name: pk_iris
        columns: [id]


    columns:
      - name: id
        data_type: varchar(9)
        constraints:
          - type: not_null

        data_tests:
          - not_null
          - unique

      - name: nom
        data_type: text

      - name: type
        data_type: varchar(1)

      - name: commune
        data_type: text

      - name: commune_id
        data_type: varchar(5)

      - name: created_at
        data_type: TIMESTAMP

      - name: updated_at
        data_type: TIMESTAMP

      - name: geom
        data_type: geometry(MultiPolygon,2154)
        data_tests:
              - not_null
              - unique
              - geometry_valid:
                  config:
                    store_failures: true