models:
  - name: electricite
    config:
      contract:
        enforced: true

    constraints:
      - type: primary_key
        columns: [id]

    columns:
      - name: id
        data_type: text
        constraints:
          - type: not_null
        data_tests:
          - not_null
          - unique
      - name: fournisseur
        data_type: text
        data_tests:
          - not_null
      - name: annee
        data_type: integer
        data_tests:
          - not_null
      - name: filiere
        data_type: varchar(1)
        data_tests:
          - not_null
      - name: iris
        data_type: text
        data_tests:
          - not_null
      - name: adresse
        data_type: text
        data_tests:
          - not_null
      - name: commune
        data_type: text
        data_tests:
          - not_null
      - name: conso
        data_type: float
      - name: pdl
        data_type: integer
      - name: iris_id
        description: Identifiant IRIS source, sans contrainte de référence.
        data_type: varchar(9)
        data_tests:
          - not_null
      - name: ban_id
        description: Identifiant BAN source, éventuellement absent ou sans correspondance.
        data_type: varchar(22)
