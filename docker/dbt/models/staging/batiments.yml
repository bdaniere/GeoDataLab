models:
  - name: batiments
    config:
      contract:
        enforced: true

    constraints:
      - type: primary_key
        # name: pk_batiments
        columns: [id]

      - type: foreign_key
        # name : fk_batiments_code_insee
        columns: [code_insee]
        to: ref('communes_france')
        to_columns: [code_insee]

    columns:
      - name: id
        data_type: uuid
        constraints:
          - type: not_null

        data_tests:
          - not_null
          - unique

      - name: type
        data_type: varchar(2)

      - name: nom
        data_type: text

      - name: code_insee
        data_type: varchar(5)

      - name: created_at
        data_type: TIMESTAMP

      - name: updated_at
        data_type: TIMESTAMP

      - name: geom
        data_type: geometry(MultiPolygon,2154)
        data_tests:
              - not_null
              - unique
              - geometry_valid:
                  config:
                    store_failures: true